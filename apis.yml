aid: tela-innovations
name: Tela Innovations
description: >-
  Tela Innovations, Inc. is a semiconductor design-technology and intellectual-property company
  founded in 2005 and headquartered in Los Gatos, California. It developed gridded, straight-line,
  one-dimensional layout structures and the pre-defined physical topologies built on them, sold as
  standard-cell libraries and embedded-SRAM peripheral circuits intended to let logic, memory,
  analog and I/O blocks scale to advanced process nodes with improvements in variability,
  performance, leakage and area — without forcing customers to change their existing design
  methodology, equipment set or process technology. Alongside the libraries it sold physical IC
  design services and layout- and power-optimization software; in 2009 it acquired Blaze DFM,
  adding patented design-for-manufacturing and power-optimization capability for digital logic in
  SoCs and ASICs. It was backed by Intel Capital, Cadence Design Systems, Qualcomm, KT Venture
  Group, Malloy & Company and Black Diamond Ventures, and a substantial share of its later
  activity was patent licensing, including a portfolio licence taken by Samsung in 2016. Tela never
  operated a developer program, public API, SDK, webhook surface or machine-readable
  specification — its products were delivered as licensed cell libraries, EDA software and design
  services under commercial agreement, not as a callable service. Its corporate host,
  www.tela-inc.com, still resolves in DNS but no longer runs a web service (ports 80 and 443 both
  refuse connections) and has no Internet Archive capture with content after January 2022, so it
  is deliberately not wired as a Website pointer. This profile is retained as a historical record;
  there is no API surface to enrich.
